<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Admin</title>
  </head>
  <body>
    <a
      href="/admin/newsletter"
      style="position:fixed; bottom:16px; right:16px; z-index:9999; background:#24504c; color:#fff; font-family:sans-serif; font-size:13px; font-weight:600; padding:10px 16px; border-radius:6px; text-decoration:none; box-shadow:0 2px 8px rgba(0,0,0,0.25);"
    >🏡 Newsletter Builder</a>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
